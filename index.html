<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EPI Quest – Missão Proteção</title>
<meta name="description" content="Quiz interativo sobre EPIs (NR-6 e NR-32) na Enfermagem – Oficina Integrada de Enfermagem.">
<meta name="theme-color" content="#0F766E">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M32 4 8 13v17c0 15 10 26 24 30 14-4 24-15 24-30V13Z' fill='%230F766E'/%3E%3Cpath d='M28 20h8v8h8v8h-8v8h-8v-8h-8v-8h8z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --primaria:#0F766E; --primaria-escura:#115E59; --primaria-clara:#CCFBF1; --primaria-suave:#F0FDFA;
  --fundo:#E0F2FE; --cartao:#FFFFFF;
  --texto:#0F172A; --texto-suave:#475569; --borda:#CBD5E1;
  --verde:#16A34A; --verde-claro:#DCFCE7; --verde-escuro:#14532D;
  --vermelho:#DC2626; --vermelho-claro:#FEE2E2; --vermelho-escuro:#7F1D1D;
  --amarelo:#F59E0B; --amarelo-claro:#FEF3C7; --amarelo-escuro:#78350F;
  --raio:20px;
  --sombra:0 12px 32px rgba(15,118,110,.10), 0 2px 6px rgba(15,23,42,.06);
  --t:240ms cubic-bezier(.2,.7,.3,1);
  --fonte:'Nunito', ui-rounded, 'Segoe UI', system-ui, -apple-system, Roboto, Arial, sans-serif;
}
*{box-sizing:border-box}
html{font-size:106.25%;-webkit-text-size-adjust:100%}
html.apresentacao{font-size:131.25%}
body{
  margin:0;min-height:100vh;font-family:var(--fonte);color:var(--texto);line-height:1.5;
  background-color:var(--fundo);
  background-image:
    radial-gradient(circle at 8% 0%, rgba(255,255,255,.9) 0, transparent 38%),
    radial-gradient(circle at 100% 100%, rgba(204,251,241,.9) 0, transparent 42%);
  background-attachment:fixed;
  overflow-x:hidden;
}
h1,h2,h3{line-height:1.2;margin:0}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--amarelo);outline-offset:3px}
[tabindex="-1"]:focus{outline:none}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
[hidden]{display:none!important}

/* ---------- Barra do topo ---------- */
.topo{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 16px;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid #BAE6FD}
.marca{display:flex;align-items:center;gap:8px;border:0;background:none;padding:6px 8px;margin-left:-8px;border-radius:12px;font-weight:900;font-size:1.05rem;color:var(--primaria);letter-spacing:.2px}
.marca svg{width:28px;height:28px;flex:none}
.topo-acoes{display:flex;gap:8px}
.btn-icone{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 14px;border-radius:999px;border:2px solid #BAE6FD;background:#fff;font-weight:800;font-size:.9rem;transition:background var(--t),border-color var(--t)}
.btn-icone:hover{border-color:var(--primaria)}
.btn-icone[aria-pressed="true"]{background:var(--primaria-clara);border-color:var(--primaria);color:var(--primaria-escura)}
.btn-icone .ico{font-size:1.1rem;line-height:1}

main{max-width:1120px;margin:0 auto;padding:22px 16px 56px}
html.apresentacao main{max-width:1500px}

/* ---------- Peças comuns ---------- */
.cartao{background:var(--cartao);border-radius:var(--raio);box-shadow:var(--sombra);padding:26px}
.sobretitulo{font-size:.82rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--primaria)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:12px 24px;border-radius:16px;border:2px solid transparent;font-weight:800;font-size:1rem;text-decoration:none;transition:transform var(--t),background var(--t),box-shadow var(--t),border-color var(--t)}
.btn:active:not(:disabled){transform:translateY(3px)}
.btn.primario{background:var(--primaria);color:#fff;box-shadow:0 5px 0 var(--primaria-escura)}
.btn.primario:hover:not(:disabled){background:#0D6B64}
.btn.primario:active:not(:disabled){box-shadow:0 2px 0 var(--primaria-escura)}
.btn.secundario{background:#fff;color:var(--primaria-escura);border-color:var(--primaria)}
.btn.secundario:hover:not(:disabled){background:var(--primaria-suave)}
.btn.texto{background:none;color:var(--primaria-escura);text-decoration:underline;text-underline-offset:3px;padding-left:12px;padding-right:12px}
.btn.grande{font-size:1.15rem;min-height:60px;padding:16px 34px;border-radius:18px}
.btn:disabled{opacity:.55;cursor:not-allowed}
.botoes{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:24px}
.voltar{margin-bottom:14px}

/* ---------- Boneco ---------- */
.boneco{display:block;width:100%;height:auto;overflow:visible}
.epi{opacity:0;transform:scale(.55) translateY(-6px);transform-box:fill-box;transform-origin:center;transition:opacity .35s ease,transform .45s cubic-bezier(.34,1.56,.64,1)}
.epi.on{opacity:1;transform:none}

/* ---------- Tela inicial ---------- */
.inicio{display:grid;grid-template-columns:1.25fr .75fr;gap:32px;align-items:center}
.titulo-jogo{font-size:clamp(2.4rem,6vw,4.2rem);font-weight:900;color:var(--primaria-escura);letter-spacing:-.02em;margin:10px 0 6px}
.titulo-jogo span{display:block;width:fit-content;margin-top:8px;font-size:.55em;color:#fff;background:var(--primaria);padding:4px 18px 6px;border-radius:999px;letter-spacing:0;transform:rotate(-1.5deg)}
.subtitulo{font-size:1.15rem;font-weight:700;color:var(--texto-suave)}
.chamada{margin:18px 0 24px;font-size:1.08rem;max-width:34em}
.creditos{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:30px;padding-top:22px;border-top:2px dashed #BAE6FD}
.creditos h2{font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:var(--primaria);margin-bottom:6px}
.creditos ul{list-style:none;margin:0;padding:0;font-weight:700}
.creditos li{padding:1px 0}
.creditos p{font-weight:700}
.inicio-arte{position:relative;max-width:330px;width:100%;justify-self:center;background:#fff;border-radius:50% 50% 28px 28px;padding:28px 34px 16px;box-shadow:var(--sombra)}
.selo-flutua{position:absolute;display:grid;place-items:center;width:52px;height:52px;border-radius:50%;background:#fff;box-shadow:var(--sombra);font-size:1.5rem;animation:flutuar 4s ease-in-out infinite}
.selo-flutua:nth-of-type(2){animation-delay:-1s}.selo-flutua:nth-of-type(3){animation-delay:-2s}.selo-flutua:nth-of-type(4){animation-delay:-3s}
@keyframes flutuar{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.referencias{margin-top:28px;padding:18px 22px}
.referencias summary{cursor:pointer;font-weight:800;color:var(--primaria-escura);min-height:32px}
.referencias ul{margin:12px 0 0;padding-left:20px;font-size:.92rem;color:var(--texto-suave)}
.referencias li{margin:6px 0}
.rodape-nota{margin-top:16px;font-size:.85rem;color:var(--texto-suave);text-align:center}

/* ---------- Escolha de modo ---------- */
.titulo-tela{font-size:clamp(1.7rem,4vw,2.4rem);font-weight:900;color:var(--primaria-escura);margin:6px 0 20px}
.modos{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.modo{display:flex;flex-direction:column;align-items:flex-start;gap:10px;text-align:left;border:3px solid transparent;background:#fff;border-radius:var(--raio);box-shadow:var(--sombra);padding:24px;transition:transform var(--t),border-color var(--t),box-shadow var(--t)}
.modo:hover{transform:translateY(-4px);border-color:var(--primaria)}
.modo .modo-ico{font-size:2.4rem;line-height:1}
.modo h2{font-size:1.35rem;font-weight:900;color:var(--primaria-escura)}
.modo p{color:var(--texto-suave)}
.modo .modo-ir{margin-top:auto;font-weight:900;color:var(--primaria)}
.ajustes{margin-top:22px;display:flex;flex-wrap:wrap;gap:14px 28px;align-items:center}
.interruptor{display:inline-flex;align-items:center;gap:12px;min-height:44px;padding:0;border:0;background:none;font-weight:800;text-align:left}
.interruptor .trilho{position:relative;flex:none;width:52px;height:30px;border-radius:999px;background:#CBD5E1;transition:background var(--t)}
.interruptor .trilho::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform var(--t)}
.interruptor[aria-checked="true"] .trilho{background:var(--primaria)}
.interruptor[aria-checked="true"] .trilho::after{transform:translateX(22px)}
.atalhos{font-size:.9rem;color:var(--texto-suave)}
kbd{display:inline-block;min-width:1.6em;padding:1px 6px;border-radius:6px;border:1px solid var(--borda);border-bottom-width:3px;background:#fff;font:inherit;font-weight:800;font-size:.85em;text-align:center}
.bloco-ranking{margin-top:26px}
.bloco-ranking h2{font-size:1.2rem;font-weight:900;color:var(--primaria-escura);margin-bottom:10px}

/* ---------- Fases ---------- */
.fases{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}
.fase-card{display:flex;flex-direction:column;align-items:flex-start;gap:8px;text-align:left;border:3px solid transparent;background:#fff;border-radius:var(--raio);box-shadow:var(--sombra);padding:22px;transition:transform var(--t),border-color var(--t)}
.fase-card:hover{transform:translateY(-3px);border-color:var(--primaria)}
.fase-card h2{font-size:1.3rem;font-weight:900;color:var(--primaria-escura)}
.fase-card p{color:var(--texto-suave)}
.fase-meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:999px;background:var(--fundo);color:#075985;font-weight:800;font-size:.85rem}

/* ---------- Equipes ---------- */
.form-equipes{max-width:720px}
.campo{margin-top:18px}
.campo>label,.campo legend{display:block;font-weight:900;margin-bottom:8px;color:var(--primaria-escura)}
fieldset{border:0;padding:0;margin:0}
.segmentado{display:inline-flex;background:var(--fundo);border-radius:14px;padding:4px;gap:4px}
.segmentado button{min-width:56px;min-height:44px;border:0;border-radius:10px;background:none;font-weight:900}
.segmentado button[aria-pressed="true"]{background:#fff;color:var(--primaria-escura);box-shadow:0 2px 6px rgba(15,23,42,.12)}
.nomes{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.nome-equipe{display:flex;align-items:center;gap:10px;border:2px solid var(--borda);border-radius:14px;padding:0 0 0 12px;background:#fff}
.nome-equipe:focus-within{border-color:var(--primaria)}
.nome-equipe .bolinha{flex:none;width:16px;height:16px;border-radius:50%;background:var(--cor)}
.nome-equipe input{flex:1;min-width:0;border:0;background:none;min-height:48px;padding:0 12px 0 0;font-weight:700;outline:none}
select{min-height:48px;border:2px solid var(--borda);border-radius:14px;padding:0 14px;background:#fff;font-weight:700;max-width:100%}
select:focus{border-color:var(--primaria);outline:none}

/* ---------- Intro da fase ---------- */
.intro{max-width:760px;margin:0 auto}
.intro h1{font-size:clamp(1.8rem,4.5vw,2.6rem);font-weight:900;color:var(--primaria-escura);margin:6px 0 8px}
.foco{font-size:1.08rem;color:var(--texto-suave)}
.intro-lista{list-style:none;margin:22px 0 0;padding:0;display:grid;gap:8px}
.intro-lista li{padding:10px 14px;background:var(--primaria-suave);border-radius:12px;font-weight:700}
.mapa{list-style:none;margin:20px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.mapa li{display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;font-weight:800;font-size:.9rem;background:#F1F5F9;color:#64748B}
.mapa li.feita{background:var(--verde-claro);color:var(--verde-escuro)}
.mapa li.atual{background:var(--primaria);color:#fff}
.mapa-ico{font-size:.95rem}

/* ---------- HUD ---------- */
.hud{padding:14px 20px;margin-bottom:18px}
.hud-topo{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 18px}
.hud-fase{display:flex;flex-direction:column}
.fase-nome{font-weight:900;color:var(--primaria-escura);font-size:1.02rem}
.fase-cont{font-size:.88rem;color:var(--texto-suave);font-weight:700}
.hud-stats{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.stat{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:4px 12px;border-radius:999px;background:var(--fundo);font-weight:900}
.stat-rot{font-size:.8rem;color:var(--texto-suave)}
.vidas{letter-spacing:2px;font-size:1.1rem;background:#FFF1F2}
.coracao{display:inline-block}
.coracao.vazio{filter:grayscale(1);opacity:.35}
.coracao.perdendo{animation:partir .7s ease forwards}
@keyframes partir{0%{transform:scale(1)}30%{transform:scale(1.4)}100%{transform:scale(1);filter:grayscale(1);opacity:.35}}
.combo{background:var(--amarelo-claro);color:var(--amarelo-escuro)}
.combo.zero{background:#F1F5F9;color:#64748B}
.combo.subiu{animation:pulsar .45s}
.progresso{height:10px;border-radius:999px;background:#E2E8F0;overflow:hidden;margin-top:12px}
.progresso span{display:block;height:100%;background:linear-gradient(90deg,var(--primaria),#14B8A6);border-radius:999px;transition:width .4s ease}
.placar{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.placar-item{display:flex;align-items:center;gap:8px;padding:6px 12px;border-radius:12px;border:2px solid transparent;background:#F8FAFC;font-weight:800;transition:border-color var(--t),background var(--t)}
.placar-item::before{content:"";width:12px;height:12px;border-radius:50%;background:var(--cor)}
.placar-item.ativo{border-color:var(--cor);background:#fff;box-shadow:0 3px 10px rgba(15,23,42,.1)}
.placar-pts{font-variant-numeric:tabular-nums;color:var(--primaria-escura)}
.placar-combo{font-size:.85rem}

/* ---------- Pergunta ---------- */
.jogo-grade{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:18px;align-items:start}
.pergunta{position:relative}
.etiquetas{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:14px}
.tag{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;font-weight:800;font-size:.88rem;background:var(--primaria-clara);color:var(--primaria-escura)}
.tag.tipo{background:#EEF2FF;color:#3730A3}
.tag.valor{background:var(--amarelo-claro);color:var(--amarelo-escuro)}
.cron{position:relative;display:inline-flex;align-items:center;gap:6px;margin-left:auto;padding:5px 14px;border-radius:999px;font-weight:900;font-variant-numeric:tabular-nums;border:2px solid var(--primaria);color:var(--primaria-escura);background:linear-gradient(90deg,var(--primaria-clara) calc(var(--frac,1)*100%),#fff 0)}
.cron.alerta{border-color:var(--vermelho);color:var(--vermelho-escuro);background:linear-gradient(90deg,var(--vermelho-claro) calc(var(--frac,1)*100%),#fff 0);animation:pulsar 1s infinite}
.vez{display:flex;align-items:center;gap:10px;margin-bottom:14px;padding:10px 16px;border-radius:14px;background:color-mix(in srgb,var(--cor) 12%,#fff);border-left:6px solid var(--cor);font-size:1.05rem}
.enunciado{font-size:clamp(1.2rem,2.4vw,1.5rem);font-weight:800;line-height:1.35;margin-bottom:20px}
.destaque-erro{display:inline-block;padding:0 8px;margin-right:4px;border-radius:8px;background:var(--vermelho-claro);color:var(--vermelho-escuro);font-weight:900}
.alternativas{display:grid;gap:12px}
.alternativas.vf{grid-template-columns:1fr 1fr}
.alt{display:flex;align-items:center;gap:14px;width:100%;min-height:62px;padding:12px 14px;text-align:left;background:#fff;border:2px solid var(--borda);border-radius:16px;font-weight:700;font-size:1.04rem;transition:border-color var(--t),background var(--t),transform var(--t),box-shadow var(--t),opacity var(--t)}
.alt:hover:not(:disabled){border-color:var(--primaria);background:var(--primaria-suave);transform:translateY(-2px);box-shadow:0 4px 0 var(--primaria-clara)}
.alt:disabled{cursor:default}
.alt .letra{flex:none;display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:var(--fundo);color:#075985;font-weight:900;transition:background var(--t),color var(--t)}
.alt .alt-texto{flex:1}
.alt .marca-res{flex:none;display:grid;place-items:center;width:34px;height:34px;border-radius:50%;font-weight:900;color:#fff;font-size:1.05rem}
.alt .marca-res:empty{display:none}
.alternativas.vf .alt{justify-content:center;font-size:1.15rem;min-height:76px}
.alternativas.vf .alt .alt-texto{flex:0 1 auto}
.alt.certa{background:var(--verde-claro);border-color:var(--verde);color:var(--verde-escuro)}
.alt.certa .letra,.alt.certa .marca-res{background:var(--verde);color:#fff}
.alt.errada{background:var(--vermelho-claro);border-color:var(--vermelho);color:var(--vermelho-escuro)}
.alt.errada .letra,.alt.errada .marca-res{background:var(--vermelho);color:#fff}
.alt.apagada{opacity:.5}
.pulsar{animation:pulsar .55s ease}
.tremer{animation:tremer .45s ease}
@keyframes pulsar{0%{transform:scale(1)}40%{transform:scale(1.035)}100%{transform:scale(1)}}
@keyframes tremer{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
.acoes{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.btn-dica{display:inline-flex;align-items:center;gap:8px;min-height:46px;padding:8px 16px;border-radius:14px;border:2px solid var(--amarelo);background:var(--amarelo-claro);color:var(--amarelo-escuro);font-weight:800;transition:background var(--t)}
.btn-dica:hover:not(:disabled){background:#FDE68A}
.btn-dica:disabled{opacity:.6;cursor:default}
.caixa-dica{margin-top:12px;padding:12px 16px;border-radius:14px;background:var(--amarelo-claro);border-left:6px solid var(--amarelo);color:var(--amarelo-escuro);animation:entrar .25s ease}

/* Ordenar */
.instrucao{color:var(--texto-suave);font-weight:700;margin:-8px 0 14px}
.ordenar{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.card-ordem{display:flex;align-items:center;gap:10px;min-height:58px;padding:6px 8px 6px 4px;background:#fff;border:2px solid var(--borda);border-radius:16px;font-weight:800;user-select:none;-webkit-user-select:none;cursor:grab;transition:border-color var(--t),background var(--t),box-shadow var(--t),transform var(--t)}
.card-ordem:hover{border-color:var(--primaria)}
.card-ordem.arrastando{cursor:grabbing;border-color:var(--primaria);background:var(--primaria-suave);box-shadow:0 10px 24px rgba(15,118,110,.25);transform:scale(1.02);position:relative;z-index:2}
.alca{flex:none;display:grid;place-items:center;width:40px;height:46px;border-radius:10px;color:#94A3B8;font-size:1.3rem;letter-spacing:-3px;touch-action:none;cursor:grab}
.num{flex:none;display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--fundo);color:#075985;font-weight:900}
.ord-texto{flex:1;min-width:0}
.setas{display:flex;gap:6px}
.seta{display:grid;place-items:center;width:44px;height:44px;border-radius:12px;border:2px solid var(--borda);background:#fff;font-weight:900;font-size:1.1rem;transition:border-color var(--t),background var(--t)}
.seta:hover:not(:disabled){border-color:var(--primaria);background:var(--primaria-suave)}
.seta:disabled{opacity:.3;cursor:default}
.card-ordem .marca-res{flex:none;display:grid;place-items:center;width:34px;height:34px;border-radius:50%;color:#fff;font-weight:900}
.card-ordem .marca-res:empty{display:none}
.ordenar.conferida .card-ordem{cursor:default}
.ordenar.conferida .setas,.ordenar.conferida .alca{display:none}
.card-ordem.certa{background:var(--verde-claro);border-color:var(--verde);color:var(--verde-escuro)}
.card-ordem.certa .marca-res,.card-ordem.certa .num{background:var(--verde);color:#fff}
.card-ordem.errada{background:var(--vermelho-claro);border-color:var(--vermelho);color:var(--vermelho-escuro)}
.card-ordem.errada .marca-res,.card-ordem.errada .num{background:var(--vermelho);color:#fff}
.card-ordem.certa,.card-ordem.errada{padding-left:12px}

/* Feedback */
.feedback{margin-top:22px;padding:20px 22px;border-radius:18px;border:2px solid;animation:entrar .3s ease}
.feedback.ok{background:#F0FDF4;border-color:#86EFAC}
.feedback.erro{background:#FEF2F2;border-color:#FCA5A5}
.veredito{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;font-size:1.15rem;font-weight:900;margin-bottom:10px}
.feedback.ok .veredito{color:var(--verde-escuro)}
.feedback.erro .veredito{color:var(--vermelho-escuro)}
.selo-res{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;color:#fff;flex:none}
.feedback.ok .selo-res{background:var(--verde)}
.feedback.erro .selo-res{background:var(--vermelho)}
.mini{font-size:.85rem;font-weight:800;opacity:.85}
.feedback .explicacao{font-size:1.04rem}
.feedback h3{font-size:1rem;font-weight:900;margin:14px 0 6px}
.ordem-correta{margin:0;padding-left:26px;font-weight:800}
.ordem-correta li{padding:2px 0}
.curiosidade{margin-top:14px;padding:12px 16px;border-radius:14px;background:var(--amarelo-claro);border-left:6px solid var(--amarelo);color:var(--amarelo-escuro)}
.fonte{margin-top:12px;font-size:.9rem;color:var(--texto-suave);font-weight:600}
.aviso-vidas{margin-top:12px;font-weight:900;color:var(--vermelho-escuro)}
.feedback .botoes{margin-top:18px}
@keyframes entrar{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* Painel do boneco */
.painel-boneco{position:sticky;top:84px;padding:18px;text-align:center}
.painel-boneco h2{font-size:1rem;font-weight:900;color:var(--primaria-escura);margin-bottom:6px}
.painel-boneco .boneco{max-width:190px;margin:0 auto}
.lista-epis{list-style:none;margin:10px 0 0;padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.lista-epis li{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:12px;background:#F1F5F9;font-size:.74rem;font-weight:800;color:#64748B;transition:background var(--t),color var(--t)}
.lista-epis li .e{font-size:1.25rem;filter:grayscale(1);opacity:.45;transition:filter var(--t),opacity var(--t)}
.lista-epis li.on{background:var(--verde-claro);color:var(--verde-escuro)}
.lista-epis li.on .e{filter:none;opacity:1}
.lista-epis li.novo{animation:pulsar .5s}
.contador-epis{margin-top:8px;font-weight:900;color:var(--primaria-escura)}
.protegido{display:inline-flex;align-items:center;gap:8px;margin-top:10px;padding:8px 14px;border-radius:999px;background:var(--verde);color:#fff;font-weight:900;animation:pulsar .6s}

/* Efeitos */
.confete{position:fixed;z-index:100;width:9px;height:13px;border-radius:2px;pointer-events:none;animation:confete .95s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes confete{from{transform:translate(-50%,-50%) rotate(0)}to{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) rotate(var(--rot));opacity:0}}
.flutua{position:fixed;z-index:100;pointer-events:none;font-weight:900;font-size:1.3rem;color:var(--verde);text-shadow:0 2px 0 #fff;animation:subir 1.1s ease-out forwards}
@keyframes subir{from{opacity:0;transform:translateY(0)}15%{opacity:1}to{opacity:0;transform:translateY(-60px)}}

/* ---------- Resultados ---------- */
.resultado{max-width:900px;margin:0 auto}
.resultado h1{font-size:clamp(1.8rem,4.5vw,2.6rem);font-weight:900;color:var(--primaria-escura);margin:6px 0 10px}
.resumo{display:grid;grid-template-columns:auto 1fr;gap:24px;align-items:center;margin-top:16px}
.nota{display:grid;place-items:center;width:150px;height:150px;border-radius:50%;background:conic-gradient(var(--primaria) calc(var(--pct)*1%),#E2E8F0 0);position:relative}
.nota::before{content:"";position:absolute;inset:12px;border-radius:50%;background:#fff}
.nota-txt{position:relative;text-align:center;line-height:1.1}
.nota-pct{display:block;font-size:2.1rem;font-weight:900;color:var(--primaria-escura)}
.nota-frac{font-size:.9rem;font-weight:800;color:var(--texto-suave)}
.estrelas{font-size:2rem;letter-spacing:4px;color:var(--amarelo)}

.linha-dados{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.secao{margin-top:28px}
.secao>h2{font-size:1.25rem;font-weight:900;color:var(--primaria-escura);margin-bottom:12px}

.medalha{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;padding:14px 10px;border-radius:16px;border:2px solid var(--amarelo);background:var(--amarelo-claro);color:var(--amarelo-escuro)}

.medalha strong{font-size:.98rem}
.medalha span.m-desc{font-size:.8rem;font-weight:700}
.medalha.bloqueada{border-color:#E2E8F0;background:#F8FAFC;color:#64748B}

.rev-tema{font-size:.85rem;font-weight:900;color:var(--primaria)}
.rev-enunciado{font-weight:800;margin:4px 0 10px}

.rev-certa{background:var(--verde-claro);color:var(--verde-escuro)}
.rev-exp{margin-top:10px;font-size:.96rem}
.rev-fonte{margin-top:6px;font-size:.85rem;color:var(--texto-suave)}
.sem-erros{font-weight:800;color:var(--verde-escuro)}
.podio{list-style:none;margin:0;padding:0;display:grid;gap:10px}

.podio .p-med{font-size:1.6rem}
.podio .p-nome{flex:1;font-size:1.1rem}
.podio .p-pts{font-size:1.2rem;font-weight:900;color:var(--primaria-escura)}
.ranking{list-style:none;margin:0;padding:0;display:grid;gap:6px}

.ranking li.novo{border-color:var(--amarelo);background:var(--amarelo-claro)}
.ranking .pos{font-weight:900;color:var(--primaria)}
.ranking .r-nome{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ranking .r-modo{font-size:.8rem;color:var(--texto-suave)}
.ranking .r-pts{font-weight:900;font-variant-numeric:tabular-nums}
.vazio{color:var(--texto-suave)}
.form-ranking label{display:block;font-weight:900;margin-bottom:8px}
.form-ranking .linha{display:flex;flex-wrap:wrap;gap:10px}
.form-ranking input{flex:1 1 200px;min-height:50px;border:2px solid var(--borda);border-radius:14px;padding:0 14px;font-weight:700}
.form-ranking input:focus{border-color:var(--primaria);outline:none}
.msg{margin-top:8px;font-weight:800;color:var(--primaria-escura);min-height:1.5em}
.mini-boneco{display:flex;align-items:center;gap:14px;margin-top:18px;padding:12px 16px;border-radius:16px;background:var(--primaria-suave)}
.mini-boneco svg{width:70px;flex:none}
details.revisao-fase{margin-top:22px}
details.revisao-fase summary{cursor:pointer;font-weight:900;color:var(--primaria-escura);min-height:36px}

/* ---------- Responsivo ---------- */
@media (max-width:860px){
  .inicio{grid-template-columns:1fr}
  .inicio-arte{order:-1;max-width:200px;padding:18px 22px 10px}
  .selo-flutua{width:40px;height:40px;font-size:1.15rem}
  .modos{grid-template-columns:1fr}
  .jogo-grade{grid-template-columns:1fr}
  .painel-boneco{position:static;order:-1;display:grid;grid-template-columns:76px 1fr;gap:4px 14px;align-items:center;text-align:left;padding:12px 14px}
  .painel-boneco h2{grid-column:2;margin:0;font-size:.92rem}
  .painel-boneco .boneco{grid-row:1/span 3;width:76px}
  .painel-boneco .lista-epis{grid-column:2;grid-template-columns:repeat(6,1fr);margin:0;gap:4px}
  .painel-boneco .lista-epis li{padding:4px 0;font-size:0}
  .painel-boneco .lista-epis li .e{font-size:1.1rem}
  .painel-boneco .contador-epis{grid-column:2;margin:0;font-size:.85rem}
  .painel-boneco .protegido{grid-column:1/-1;justify-self:start}
}
@media (max-width:600px){
  html{font-size:100%}
  main{padding:16px 16px 48px}
  .cartao{padding:18px}
  .hud{padding:12px 14px}
  .topo .rotulo{display:none}
  .btn-icone{padding:0 12px}
  .creditos{grid-template-columns:1fr}
  .fases{grid-template-columns:1fr}
  .nomes{grid-template-columns:1fr}
  .alternativas.vf{grid-template-columns:1fr 1fr}
  .alt{gap:10px;padding:10px 12px;font-size:1rem}
  .alt .letra{width:34px;height:34px}
  .resumo{grid-template-columns:1fr;justify-items:center;text-align:center}
  .linha-dados{justify-content:center}
  .botoes .btn{flex:1 1 auto}
  .card-ordem{gap:6px;font-size:.95rem}
  .seta{width:40px;height:40px}
  .ranking li{grid-template-columns:36px 1fr auto}
  .ranking .r-modo{display:none}
  .feedback .atalhos{display:none}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}

  function tom(freq, inicio, dur, tipo, vol) {
    const a = audio(); if (!a) return;

      const o = a.createOscillator(), g = a.createGain(), t = a.currentTime + inicio;
      o.type = tipo || 'sine'; o.frequency.setValueAtTime(freq, t);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol || 0.2, t + 0.015);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(a.destination);
      o.start(t); o.stop(t + dur + 0.05);
    } catch (e) { /* sem som */ }
  }

      const s = document.createElement('span');
      s.className = 'confete';
      s.style.left = cx + 'px'; s.style.top = cy + 'px';
      s.style.background = cores[i % cores.length];
      const ang = Math.random() * Math.PI * 2, dist = 70 + Math.random() * 130;
      s.style.setProperty('--dx', (Math.cos(ang) * dist).toFixed(0) + 'px');
      s.style.setProperty('--dy', (Math.sin(ang) * dist + 50).toFixed(0) + 'px');
      s.style.setProperty('--rot', (Math.random() * 720 - 360).toFixed(0) + 'deg');
      document.body.appendChild(s);
      setTimeout(function () { s.remove(); }, 1000);
    }
  }

  /* ================= Partida ================= */
  // Há uma fase só ("Desafio Relâmpago"); a sequência fica sempre [0].
  function novoJogo(modo, nomesEquipes) {
    J = {
      modo: modo, sequencia: [0], pos: 0,
      pontos: 0, registros: [], combo: 0, maxCombo: 0,
      equipes: nomesEquipes ? nomesEquipes.map(function (nome, i) { return { nome: nome, cor: CORES_EQUIPES[i], pontos: 0, combo: 0 }; }) : null,
      vez: 0,
      refazer: { modo: modo, nomes: nomesEquipes ? nomesEquipes.slice() : null }
    };
    renderIntroFase();
  }

  function placarHTML() {
    return '<div class="placar" id="placar" aria-label="Placar das equipes">' + J.equipes.map(function (e, i) {
      return '<div class="placar-item' + (i === J.vez ? ' ativo' : '') + '" style="--cor:' + e.cor + '"><span class="placar-nome">' + esc(e.nome) + '</span><span class="placar-pts">' + e.pontos + ' pts</span>' + (e.combo >= 2 ? '<span class="placar-combo" aria-label="combo ' + e.combo + '">🔥' + e.combo + '</span>' : '') + '</div>';
    }).join('') + '</div>';
  }

  function renderIntroFase() {
    const fase = faseAtual();
    const itens = [
      '📋 ' + fase.perguntas.length + ' perguntas rápidas',
      '🥼 Cada acerto veste um EPI no profissional',
      '🏆 Tente acertar todas!'
    ];
    mostrar('intro',
      '<section class="intro cartao">' +
        '<p class="sobretitulo">' + (J.equipes ? 'Modo equipes · ' + J.equipes.length + ' equipes' : 'Partida rápida') + '</p>' +
        '<h1 tabindex="-1" data-foco>' + esc(fase.nome) + '</h1>' +
        '<p class="foco">' + esc(FOCO[fase.idx] || '') + '</p>' +
        (J.equipes ? placarHTML() : '') +
        '<ul class="intro-lista">' + itens.map(function (i) { return '<li>' + i + '</li>'; }).join('') + '</ul>' +
        '<div class="botoes"><button class="btn primario grande" id="comecar-fase" type="button">Começar →</button><button class="btn texto" id="sair" type="button">Voltar ao início</button></div>' +
      '</section>'
    );
    on('#comecar-fase', 'click', function () { audio(); iniciarFase(); });
    on('#sair', 'click', function () { sair(false); });
  }

  function iniciarFase() {
    const fase = faseAtual();
    // Múltipla escolha e V/F em ordem sorteada; a de ordenar fica sempre por último ("grande final").
    const ordenar = fase.perguntas.filter(function (q) { return q.tipo === 'ordenar'; });
    J.perguntas = embaralhar(fase.perguntas.filter(function (q) { return q.tipo !== 'ordenar'; })).concat(ordenar);
    J.qi = 0; J.vidas = 3; J.epis = 0;
    J.pontosInicioFase = J.pontos;
    J.regInicioFase = J.registros.length;
    J.combo = 0;
    if (J.equipes) J.equipes.forEach(function (e) { e.combo = 0; });
    renderPergunta();
  }

  /* ---------- HUD ---------- */
  function coracoesHTML(perdendo) {
    let s = '';
    for (let i = 0; i < 3; i++) {
      const cls = i < J.vidas ? '' : (perdendo && i === J.vidas ? ' perdendo' : ' vazio');
      s += '<span class="coracao' + cls + '" aria-hidden="true">❤️</span>';
    }
    return s;
  }
  function comboAtual() { const eq = equipeDaVez(); return eq ? eq.combo : J.combo; }
  function comboHTML() {
    const c = comboAtual();
    const bonus = Math.min(Math.max(c, 0), 5) * 10;
    return c >= 1 ? '🔥 ' + c + ' seguida' + (c > 1 ? 's' : '') + (bonus ? ' <span class="mini">(+' + bonus + '% no próximo)</span>' : '') : '🔥 Combo 0';
  }
  function hudHTML() {
    const fase = faseAtual(), total = J.perguntas.length;
    return '<div class="hud cartao">' +
      '<div class="hud-topo">' +
        '<div class="hud-fase"><span class="fase-nome">' + esc(fase.nome) + '</span><span class="fase-cont">Pergunta ' + (J.qi + 1) + ' de ' + total + '</span></div>' +
        '<div class="hud-stats">' +
          (J.equipes ? '' : '<div class="stat" title="Pontos"><span aria-hidden="true">⭐</span><span id="hud-pontos">' + J.pontos + '</span><span class="stat-rot">pts</span></div>') +
          (J.equipes ? '' : '<div class="stat vidas" id="hud-vidas" role="img" aria-label="Vidas: ' + J.vidas + ' de 3">' + coracoesHTML(false) + '</div>') +
          '<div class="stat combo' + (comboAtual() ? '' : ' zero') + '" id="hud-combo">' + comboHTML() + '</div>' +
        '</div>' +
      '</div>' +
      '<div class="progresso" role="progressbar" aria-label="Progresso da fase" aria-valuemin="0" aria-valuemax="' + total + '" aria-valuenow="' + J.qi + '"><span id="hud-barra" style="width:' + (J.qi / total * 100) + '%"></span></div>' +
      (J.equipes ? placarHTML() : '') +
    '</div>';
  }
  function atualizarHUD(perdeuVida, subiuCombo) {
    const total = J.perguntas.length;
    const p = document.getElementById('hud-pontos'); if (p) p.textContent = J.pontos;
    const v = document.getElementById('hud-vidas');
    if (v) { v.innerHTML = coracoesHTML(perdeuVida); v.setAttribute('aria-label', 'Vidas: ' + J.vidas + ' de 3'); }
    const c = document.getElementById('hud-combo');
    if (c) { c.innerHTML = comboHTML(); c.classList.toggle('zero', !comboAtual()); if (subiuCombo) animar(c, 'subiu'); }
    const b = document.getElementById('hud-barra'); if (b) b.style.width = ((J.qi + 1) / total * 100) + '%';
    const pr = tela.querySelector('.progresso'); if (pr) pr.setAttribute('aria-valuenow', String(J.qi + 1));
    const pl = document.getElementById('placar'); if (pl) pl.outerHTML = placarHTML();
  }

  function painelBonecoHTML() {
    return '<aside class="painel-boneco cartao" aria-label="Vista o profissional">' +
      '<h2>Vista o profissional</h2>' +
      '<div id="boneco-jogo">' + bonecoSVG(J.epis) + '</div>' +
      listaEpisHTML(J.epis) +
      '<p class="contador-epis" id="contador-epis">' + J.epis + ' de ' + EPIS.length + ' EPIs</p>' +
      '<div id="selo-protegido">' + (J.epis >= EPIS.length ? '<span class="protegido">🛡️ 100% protegido!</span>' : '') + '</div>' +
    '</aside>';
  }
  function atualizarBoneco(ganhou) {
    tela.querySelectorAll('#boneco-jogo [data-epi]').forEach(function (g) {
      const i = EPIS.findIndex(function (e) { return e.id === g.dataset.epi; });
      g.classList.toggle('on', i < J.epis);
    });
    tela.querySelectorAll('.lista-epis li').forEach(function (li, i) {
      const ligado = i < J.epis;
      li.classList.toggle('on', ligado);
      li.querySelector('.sr-only').textContent = ligado ? ' (vestido)' : ' (falta)';
      if (ganhou && i === J.epis - 1) animar(li, 'novo');
    });
    const svg = tela.querySelector('#boneco-jogo svg');
    if (svg) svg.setAttribute('aria-label', 'Profissional de saúde com ' + J.epis + ' de 6 EPIs');
    const ct = document.getElementById('contador-epis'); if (ct) ct.textContent = J.epis + ' de ' + EPIS.length + ' EPIs';
    const sp = document.getElementById('selo-protegido');
    if (sp && J.epis >= EPIS.length && !sp.innerHTML) sp.innerHTML = '<span class="protegido">🛡️ 100% protegido!</span>';
  }

  /* ---------- Pergunta ---------- */
  function valorDaPergunta(q) {
    const base = faseAtual().base;
    const bonus = Math.min(comboAtual(), 5) * 10;
    let pts = Math.round(base * (1 + bonus / 100));
    if (J.r && J.r.dicaUsada) pts = Math.round(pts / 2);
    return pts;
  }

  function renderPergunta() {
    const q = atual();
    J.r = { respondida: false, dicaUsada: false };
    const eq = equipeDaVez();
    let corpo = '';
    if (q.tipo === 'multipla') {
      corpo = '<div class="alternativas" role="group" aria-label="Alternativas">' + q.alternativas.map(function (a) {
        const p = partirAlternativa(a);
        return '<button class="alt" type="button" data-valor="' + p.letra + '"><span class="letra" aria-hidden="true">' + p.letra + '</span><span class="alt-texto"><span class="sr-only">Letra ' + p.letra + ': </span>' + esc(p.texto) + '</span><span class="marca-res" aria-hidden="true"></span><span class="sr-only estado"></span></button>';
      }).join('') + '</div>';
    } else if (q.tipo === 'verdadeiro_falso') {
      corpo = '<div class="alternativas vf" role="group" aria-label="Verdadeiro ou falso">' + q.alternativas.map(function (a) {
        const ico = a === 'Verdadeiro' ? 'V' : 'F';
        return '<button class="alt" type="button" data-valor="' + esc(a) + '"><span class="letra" aria-hidden="true">' + ico + '</span><span class="alt-texto">' + esc(a) + '</span><span class="marca-res" aria-hidden="true"></span><span class="sr-only estado"></span></button>';
      }).join('') + '</div>';
    } else {
      let ordem = embaralhar(q.ordem_correta.slice());
      let tentativas = 0;
      while (ordem.every(function (t, i) { return t === q.ordem_correta[i]; }) && tentativas++ < 20) ordem = embaralhar(ordem);
      corpo = '<p class="instrucao">Arraste os cartões pela alça ⋮⋮ ou use os botões ↑ ↓. Depois toque em “Conferir”.</p>' +
        '<ol class="ordenar" id="lista-ordem" aria-label="Itens para ordenar">' + ordem.map(function (t, i) {
          return '<li class="card-ordem" data-texto="' + esc(t) + '"><span class="alca" aria-hidden="true">⋮⋮</span><span class="num">' + (i + 1) + '</span><span class="ord-texto">' + esc(t) + '</span><span class="marca-res" aria-hidden="true"></span><span class="sr-only estado"></span>' +
            '<span class="setas"><button type="button" class="seta" data-dir="-1" aria-label="Subir: ' + esc(t) + '">↑</button><button type="button" class="seta" data-dir="1" aria-label="Descer: ' + esc(t) + '">↓</button></span></li>';
        }).join('') + '</ol>' +
        '<div class="acoes"><button class="btn primario" id="conferir" type="button">✔ Conferir ordem</button></div>';
    }
    const enunciado = esc(q.enunciado).replace(/^ENCONTRE O ERRO:\s*/i, '<span class="destaque-erro">ENCONTRE O ERRO:</span> ');

    mostrar('pergunta',
      hudHTML() +
      '<div class="jogo-grade">' +
        '<article class="pergunta cartao" id="cartao-pergunta">' +
          '<div class="etiquetas">' +
            '<span class="tag">' + iconeTema(q.epi_tema) + ' ' + esc(q.epi_tema) + '</span>' +
            '<span class="tag tipo">' + rotuloTipo(q) + '</span>' +
            '<span class="tag valor" id="valor">Vale ' + valorDaPergunta(q) + ' pts</span>' +
            '<span class="cron" id="cron" hidden role="timer" aria-label="Tempo restante">⏱️ <span class="cron-num">' + (q.tipo === 'ordenar' ? TEMPO_ORDENAR : TEMPO_PERGUNTA) + '</span>s</span>' +
          '</div>' +
          (eq ? '<div class="vez" style="--cor:' + eq.cor + '">👉 Vez da <strong>' + esc(eq.nome) + '</strong></div>' : '') +
          '<h2 class="enunciado" tabindex="-1" data-foco>' + enunciado + '</h2>' +
          corpo +
          '<div class="acoes"><button class="btn-dica" id="btn-dica" type="button">🗝️ Dica <span class="mini">(o acerto vale metade)</span></button></div>' +
          '<div class="caixa-dica" id="caixa-dica" hidden></div>' +
          '<div id="feedback" hidden></div>' +
        '</article>' +
        painelBonecoHTML() +
      '</div>'
    );

    tela.querySelectorAll('.alt').forEach(function (b) {
      b.addEventListener('click', function () { responder(b.dataset.valor); });
    });
    if (q.tipo === 'ordenar') prepararOrdenar();
    on('#btn-dica', 'click', usarDica);
    iniciarCronometro(q);
  }

  function usarDica() {
    if (!J.r || J.r.dicaUsada || J.r.respondida) return;
    const q = atual();
    J.r.dicaUsada = true;
    const box = $('#caixa-dica');
    box.innerHTML = '<strong>🗝️ Dica:</strong> ' + esc(q.dica);
    box.hidden = false;
    const b = $('#btn-dica'); b.disabled = true; b.innerHTML = '🗝️ Dica usada';
    const v = $('#valor'); if (v) v.textContent = 'Vale ' + valorDaPergunta(q) + ' pts';
    anunciar('Dica: ' + q.dica);
  }

  /* ---------- Cronômetro ---------- */
  function pararCronometro() { if (cron) { clearInterval(cron); cron = null; } }
  function iniciarCronometro(q) {
    pararCronometro();
    if (!config.cronometro) return;
    const total = q.tipo === 'ordenar' ? TEMPO_ORDENAR : TEMPO_PERGUNTA;
    const fim = Date.now() + total * 1000;
    const el = $('#cron'); if (!el) return;
    el.hidden = false;
    let ultimoAviso = null;
    const tick = function () {
      const resta = Math.max(0, (fim - Date.now()) / 1000);
      const seg = Math.ceil(resta);
      el.querySelector('.cron-num').textContent = seg;
      el.style.setProperty('--frac', (resta / total).toFixed(3));
      el.classList.toggle('alerta', resta <= 10);
      if (seg === 10 && ultimoAviso !== 10) { ultimoAviso = 10; anunciar('Faltam 10 segundos'); }
      if (resta <= 0) { pararCronometro(); tempoEsgotado(); }
    };
    tick();
    cron = setInterval(tick, 200);
  }
  function tempoEsgotado() {
    if (!J || !J.r || J.r.respondida) return;
    const q = atual();
    if (q.tipo === 'ordenar') { conferirOrdem(true); return; }
    tela.querySelectorAll('.alt').forEach(function (b) {
      b.disabled = true;
      if (b.dataset.valor === q.correta) { b.classList.add('certa'); b.querySelector('.marca-res').textContent = '✔'; b.querySelector('.estado').textContent = ' – resposta certa'; }
      else b.classList.add('apagada');
    });
    aplicarResultado(false, { resposta: 'Sem resposta (tempo esgotado)', tempo: true, origem: $('#cartao-pergunta') });
  }

  /* ---------- Responder (múltipla escolha e V/F) ---------- */
  function responder(valor) {
    if (!J || !J.r || J.r.respondida) return;
    const q = atual();
    const certa = valor === q.correta;
    let escolhido = null;
    tela.querySelectorAll('.alt').forEach(function (b) {
      b.disabled = true;
      const v = b.dataset.valor;
      if (v === q.correta) {
        b.classList.add('certa'); b.querySelector('.marca-res').textContent = '✔';
        b.querySelector('.estado').textContent = v === valor ? ' – sua resposta, certa' : ' – resposta certa';
      } else if (v === valor) {
        b.classList.add('errada'); b.querySelector('.marca-res').textContent = '✖';
        b.querySelector('.estado').textContent = ' – sua resposta, errada';
      } else {
        b.classList.add('apagada');
      }
      if (v === valor) escolhido = b;
    });
    animar(escolhido, certa ? 'pulsar' : 'tremer');
    const resposta = q.tipo === 'multipla' ? (q.alternativas.find(function (a) { return partirAlternativa(a).letra === valor; }) || valor) : valor;
    aplicarResultado(certa, { resposta: resposta, origem: escolhido });
  }

  /* ---------- Minijogo de ordenar ---------- */
  function renumerar(lista) {
    const itens = Array.prototype.slice.call(lista.children);
    itens.forEach(function (li, i) {
      li.querySelector('.num').textContent = i + 1;
      li.querySelector('[data-dir="-1"]').disabled = i === 0;
      li.querySelector('[data-dir="1"]').disabled = i === itens.length - 1;
    });
  }
  function prepararOrdenar() {
    const lista = $('#lista-ordem');
    renumerar(lista);
    lista.addEventListener('click', function (e) {
      const b = e.target.closest('.seta'); if (!b || J.r.respondida) return;
      const li = b.closest('.card-ordem');
      const dir = Number(b.dataset.dir);
      if (dir < 0 && li.previousElementSibling) lista.insertBefore(li, li.previousElementSibling);
      else if (dir > 0 && li.nextElementSibling) lista.insertBefore(li.nextElementSibling, li);
      renumerar(lista);
      const pos = Array.prototype.indexOf.call(lista.children, li) + 1;
      const mesmo = li.querySelector('[data-dir="' + dir + '"]');
      const outro = li.querySelector('[data-dir="' + (-dir) + '"]');
      (mesmo.disabled ? outro : mesmo).focus();
      anunciar(li.dataset.texto + ': posição ' + pos);
    });
    lista.addEventListener('pointerdown', function (e) {
      if (J.r.respondida) return;
      const li = e.target.closest('.card-ordem');
      if (!li || e.target.closest('button')) return;
      if (e.pointerType !== 'mouse' && !e.target.closest('.alca')) return; // no toque, só pela alça (assim a página ainda rola)
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      e.preventDefault();
      arrasto = { li: li, lista: lista, id: e.pointerId };
      li.classList.add('arrastando');
    });
    on('#conferir', 'click', function () { conferirOrdem(false); });
  }
  document.addEventListener('pointermove', function (e) {
    if (!arrasto || e.pointerId !== arrasto.id) return;
    e.preventDefault();
    const y = e.clientY, lista = arrasto.lista, li = arrasto.li;
    const irmaos = Array.prototype.filter.call(lista.children, function (x) { return x !== li; });
    const antes = irmaos.find(function (x) { const r = x.getBoundingClientRect(); return y < r.top + r.height / 2; }) || null;
    if (li.nextElementSibling !== antes) { lista.insertBefore(li, antes); renumerar(lista); }
  }, { passive: false });
  function soltarArrasto(e) {
    if (!arrasto || e.pointerId !== arrasto.id) return;
    const li = arrasto.li, lista = arrasto.lista;
    li.classList.remove('arrastando');
    anunciar(li.dataset.texto + ': posição ' + (Array.prototype.indexOf.call(lista.children, li) + 1));
    arrasto = null;
  }
  document.addEventListener('pointerup', soltarArrasto);
  document.addEventListener('pointercancel', soltarArrasto);

  function conferirOrdem(porTempo) {
    if (!J || !J.r || J.r.respondida) return;
    const q = atual();
    const lista = $('#lista-ordem');
    if (arrasto) { arrasto.li.classList.remove('arrastando'); arrasto = null; }
    const itens = Array.prototype.slice.call(lista.children);
    let certas = 0;
    itens.forEach(function (li, i) {
      const ok = li.dataset.texto === q.ordem_correta[i]; // compara o texto de cada posição
      if (ok) certas++;
      li.classList.add(ok ? 'certa' : 'errada');
      li.querySelector('.marca-res').textContent = ok ? '✔' : '✖';
      li.querySelector('.estado').textContent = ok ? ' – posição certa' : ' – posição errada';
      li.querySelectorAll('button').forEach(function (b) { b.disabled = true; });
      if (!ok) animar(li, 'tremer');
    });
    lista.classList.add('conferida');
    const bc = $('#conferir'); if (bc) bc.closest('.acoes').hidden = true;
    const certa = certas === itens.length;
    const resposta = itens.map(function (li, i) { return (i + 1) + '. ' + li.dataset.texto; }).join(' → ');
    aplicarResultado(certa, { resposta: resposta, posicoesCertas: certas, tempo: porTempo && !certa, origem: lista });
  }

  /* ---------- Resultado de cada resposta ---------- */
  function aplicarResultado(certa, info) {
    const q = atual(), fase = faseAtual();
    J.r.respondida = true;
    pararCronometro();
    const eq = equipeDaVez();
    const alvo = eq || J;
    let pts = 0, bonus = 0;
    if (certa) {
      bonus = Math.min(alvo.combo, 5) * 10;           // +10% por acerto seguido anterior, até +50%
      pts = Math.round(fase.base * (1 + bonus / 100));
      if (J.r.dicaUsada) pts = Math.round(pts / 2);   // dica: metade dos pontos
      alvo.combo++;
      J.maxCombo = Math.max(J.maxCombo, alvo.combo);
      if (eq) eq.pontos += pts;
      J.pontos += pts;
      J.epis = Math.min(J.epis + 1, EPIS.length);
      somAcerto();
      confete(info.origem);
      flutuar(info.origem, '+' + pts);
    } else {
      alvo.combo = 0;
      info.perdeuVida = !J.equipes && J.vidas > 0;
      if (info.perdeuVida) J.vidas--;
      somErro();
    }
    J.registros.push({ q: q, certa: certa, resposta: info.resposta, tempo: !!info.tempo, faseIdx: fase.idx, equipe: eq ? eq.nome : null, pontos: pts, dica: J.r.dicaUsada });
    const bd = $('#btn-dica'); if (bd) bd.disabled = true;
    atualizarHUD(!!info.perdeuVida, certa);
    atualizarBoneco(certa);
    mostrarFeedback(certa, pts, bonus, info);
  }

  function mostrarFeedback(certa, pts, bonus, info) {
    const q = atual();
    const acabouAgora = info.perdeuVida && J.vidas <= 0; // perdeu o último coração nesta pergunta
    const ultima = J.qi >= J.perguntas.length - 1;
    let veredito;
    if (certa) {
      veredito = '<p class="veredito"><span class="selo-res" aria-hidden="true">✔</span>' + (J.equipes ? 'Ponto para ' + esc(equipeDaVez().nome) + '!' : 'Resposta certa!') + ' <span>+' + pts + ' pontos</span>' +
        (bonus ? ' <span class="mini">(combo +' + bonus + '%)</span>' : '') + (J.r.dicaUsada ? ' <span class="mini">(com dica)</span>' : '') + '</p>';
    } else {
      const corr = q.tipo === 'multipla' ? 'a letra ' + q.correta : q.tipo === 'verdadeiro_falso' ? '“' + q.correta + '”' : 'a ordem abaixo';
      veredito = '<p class="veredito"><span class="selo-res" aria-hidden="true">✖</span>' + (info.tempo ? 'Tempo esgotado!' : 'Não foi dessa vez.') + ' A resposta certa é ' + corr + '.' +
        (info.perdeuVida ? ' <span class="mini">Você perdeu uma vida.</span>' : '') + '</p>';
    }
    let extra = '';
    if (q.tipo === 'ordenar') {
      extra = (info.posicoesCertas !== undefined ? '<p><strong>' + info.posicoesCertas + ' de ' + q.ordem_correta.length + '</strong> posições certas.</p>' : '') +
        '<h3>Ordem correta</h3><ol class="ordem-correta">' + q.ordem_correta.map(function (t) { return '<li>' + esc(t) + '</li>'; }).join('') + '</ol>';
    }
    const fb = $('#feedback');
    fb.className = 'feedback ' + (certa ? 'ok' : 'erro');
    fb.innerHTML = veredito + extra +
      (q.tipo === 'ordenar' ? '<h3>Por quê?</h3>' : '') +
      '<p class="explicacao">' + esc(q.explicacao) + '</p>' +
      (q.curiosidade ? '<p class="curiosidade"><span aria-hidden="true">💡</span> <strong>Curiosidade:</strong> ' + esc(q.curiosidade) + '</p>' : '') +
      '<p class="fonte">📚 Fonte: ' + esc(q.fonte) + '</p>' +
      (acabouAgora && !ultima ? '<p class="aviso-vidas">💔 Sem vidas, mas siga até o fim!</p>' : '') +
      '<div class="botoes"><button class="btn primario" id="proxima" type="button">' + (ultima ? 'Ver resultado →' : 'Próxima pergunta →') + '</button>' +
      '<span class="atalhos">ou <kbd>Enter</kbd> / <kbd>→</kbd></span></div>';
    fb.hidden = false;
    on('#proxima', 'click', proxima);
    const btn = $('#proxima');
    btn.focus({ preventScroll: true });
    setTimeout(function () { fb.scrollIntoView({ behavior: semMovimento() ? 'auto' : 'smooth', block: 'nearest' }); }, 60);
    anunciar(textoPuro(veredito) + ' ' + q.explicacao);
  }

  function proxima() {
    if (!J) return;
    if (J.equipes) J.vez = (J.vez + 1) % J.equipes.length;
    J.qi++; // mesmo sem vidas, a partida segue até a última pergunta
    if (J.qi >= J.perguntas.length) { fimFase(); return; }
    renderPergunta();
  }

  /* ================= Fim de fase e tela final ================= */
  function fimFase() {
    pararCronometro();
    const fase = faseAtual();
    const regs = J.registros.slice(J.regInicioFase);
    const acertos = regs.filter(function (r) { return r.certa; }).length;
    const total = J.perguntas.length;
    const pct = Math.round(acertos / total * 100);
    J.ultimaFase = { fase: fase, regs: regs, acertos: acertos, total: total, pct: pct, semVidas: !J.equipes && J.vidas <= 0, completo: J.epis >= EPIS.length };
    renderFinal();
  }

  function revisaoHTML(regs) {
    const erros = regs.filter(function (r) { return !r.certa; });
    if (!erros.length) return '<p class="sem-erros">Nenhum erro para revisar. 👏</p>';
    return '<ol class="revisao">' + erros.map(function (r) {
      return '<li class="rev">' +
        '<p class="rev-tema">' + iconeTema(r.q.epi_tema) + ' ' + esc(r.q.epi_tema) + ' · ' + esc(r.q.fase) + (r.equipe ? ' · ' + esc(r.equipe) : '') + '</p>' +
        '<p class="rev-enunciado">' + esc(r.q.enunciado) + '</p>' +
        '<p class="rev-sua"><span aria-hidden="true">✖</span><span><strong>Resposta dada:</strong> ' + esc(r.resposta) + '</span></p>' +
        '<p class="rev-certa"><span aria-hidden="true">✔</span><span><strong>Resposta certa:</strong> ' + esc(respostaCerta(r.q)) + '</span></p>' +
        '<p class="rev-exp">' + esc(r.q.explicacao) + '</p>' +
        '<p class="rev-fonte">📚 ' + esc(r.q.fonte) + '</p>' +
      '</li>';
    }).join('') + '</ol>';
  }

  function miniBonecoHTML(res) {
    return '<div class="mini-boneco">' + bonecoSVG(J.epis, 'Profissional com ' + J.epis + ' de 6 EPIs') +
      '<div>' + (res.completo ? '<span class="protegido">🛡️ Profissional 100% protegido!</span>' : '<strong>' + J.epis + ' de 6 EPIs vestidos nesta partida.</strong><br><span class="mini">Faltou acertar mais ' + (EPIS.length - J.epis) + ' para proteger o profissional por completo.</span>') + '</div></div>';
  }

  function rotuloModo() {
    return J.modo === 'equipes' ? 'Equipes' : 'Partida rápida';
  }

  function rankingHTML(destaqueId) {
    const r = lerRanking();
    if (!r.length) return '<p class="vazio">Ainda não há pontuações salvas neste aparelho.</p>';
    return '<ol class="ranking">' + r.slice(0, 10).map(function (x, i) {
      return '<li class="' + (x.id === destaqueId ? 'novo' : '') + '"><span class="pos">' + (i + 1) + 'º</span><span class="r-nome">' + esc(x.nome) + '</span><span class="r-modo">' + esc(x.modo) + ' · ' + x.pct + '%</span><span class="r-pts">' + x.pontos + ' pts</span></li>';
    }).join('') + '</ol>';
  }
  function salvarNoRanking(entradas) {
    const r = lerRanking();
    entradas.forEach(function (e) { r.push(e); });
    r.sort(function (a, b) { return b.pontos - a.pontos; });
    return guardar.gravar(CHAVE_RANKING, r.slice(0, 30));
  }

  function renderFinal() {
    const uf = J.ultimaFase;
    const total = uf.total;
    const regs = J.registros;
    const acertos = uf.acertos;
    const pct = uf.pct;
    let titulo, sub = '';
    if (J.equipes) {
      const ord = J.equipes.slice().sort(function (a, b) { return b.pontos - a.pontos; });
      titulo = ord.length > 1 && ord[0].pontos === ord[1].pontos ? '🤝 Empate no topo!' : '🏆 Vitória da ' + esc(ord[0].nome) + '!';
    } else if (acertos === total) { titulo = '🏆 Missão cumprida!'; sub = 'Você acertou todas as perguntas.'; }
    else if (uf.semVidas) { titulo = '💪 Você foi até o fim!'; sub = 'As vidas acabaram, mas você completou o desafio.'; }
    else { titulo = '✅ Desafio concluído!'; }

    let blocoEquipes = '';
    if (J.equipes) {
      const ord = J.equipes.slice().sort(function (a, b) { return b.pontos - a.pontos; });
      const med = ['🥇', '🥈', '🥉', '🎖️'];
      blocoEquipes = '<section class="secao"><h2>Placar final</h2><ol class="podio">' + ord.map(function (e, i) {
        const rs = regs.filter(function (r) { return r.equipe === e.nome; });
        const ac = rs.filter(function (r) { return r.certa; }).length;
        return '<li style="--cor:' + e.cor + '"><span class="p-med" aria-hidden="true">' + med[i] + '</span><span class="p-nome">' + esc(e.nome) + '<br><span class="mini">' + ac + ' acerto' + (ac === 1 ? '' : 's') + ' em ' + rs.length + '</span></span><span class="p-pts">' + e.pontos + ' pts</span></li>';
      }).join('') + '</ol></section>';
    }

    const medalhas = J.equipes ? '' : '<section class="secao"><h2>Medalhas</h2><div class="medalhas">' + MEDALHAS.map(function (m) {
      const ok = m.teste(regs, total);
      return '<div class="medalha' + (ok ? '' : ' bloqueada') + '"><span class="m-ico" aria-hidden="true">' + m.icone + '</span><strong>' + m.nome + '</strong><span class="m-desc">' + m.desc + '</span><span class="sr-only">' + (ok ? 'Conquistada' : 'Não conquistada') + '</span></div>';
    }).join('') + '</div></section>';

    const formRanking = J.equipes
      ? '<div class="botoes" style="margin-top:0"><button class="btn secundario" id="salvar-equipes" type="button">Salvar o placar das equipes no ranking</button></div><p class="msg" id="msg-ranking" role="status"></p>'
      : '<form class="form-ranking" id="form-ranking"><label for="nome-ranking">Seu nome (ou do grupo) para o ranking</label><div class="linha"><input id="nome-ranking" maxlength="24" autocomplete="off" placeholder="Ex.: Turma da manhã"><button class="btn secundario" type="submit">Salvar no ranking</button></div><p class="msg" id="msg-ranking" role="status"></p></form>';

    // "Jogar de novo" fica no alto da tela, grande e em destaque, para passar rápido ao próximo jogador
    const botoes = '<button class="btn primario grande" id="jogar-novo" type="button">🔁 Jogar de novo</button>' +
      '<button class="btn texto" id="inicio" type="button">Voltar ao início</button>';

    mostrar('final',
      '<section class="resultado cartao">' +
        '<p class="sobretitulo">' + esc(rotuloModo()) + '</p>' +
        '<h1 tabindex="-1" data-foco>' + titulo + '</h1>' +
        (sub ? '<p class="foco">' + sub + '</p>' : '') +
        '<div class="resumo">' +
          '<div class="nota" style="--pct:' + pct + '"><span class="nota-txt"><span class="nota-pct">' + pct + '%</span><span class="nota-frac">' + acertos + ' de ' + total + '</span></span></div>' +
          '<div>' + estrelasHTML(estrelas(pct)) +
            '<div class="linha-dados"><span class="chip">⭐ ' + J.pontos + ' pontos</span><span class="chip">✔ ' + acertos + ' acertos</span><span class="chip">✖ ' + regs.filter(function (r) { return !r.certa; }).length + ' erros</span>' +
            (total > regs.length ? '<span class="chip">⏸ ' + (total - regs.length) + ' sem responder</span>' : '') +
            '<span class="chip">🔥 maior combo: ' + J.maxCombo + '</span></div>' +
          '</div>' +
        '</div>' +
        '<div class="botoes">' + botoes + '</div>' +
        miniBonecoHTML(uf) +
        blocoEquipes +
        medalhas +
        '<section class="secao"><h2>Revisão dos erros</h2>' + revisaoHTML(regs) + '</section>' +
        '<section class="secao"><h2>🏅 Ranking deste aparelho</h2>' + formRanking + '<div id="lista-ranking" style="margin-top:12px">' + rankingHTML() + '</div>' +
          '<div class="botoes" style="margin-top:12px"><button class="btn texto" id="limpar-ranking" type="button">Apagar ranking</button></div></section>' +
        '<div class="botoes"><button class="btn primario grande" id="jogar-novo-2" type="button">🔁 Jogar de novo</button></div>' +
      '</section>'
    );
    if (pct >= 60) { somVitoria(); confete($('.nota'), 50); }

    const msg = $('#msg-ranking');
    on('#form-ranking', 'submit', function (e) {
      e.preventDefault();
      const nome = $('#nome-ranking').value.trim() || 'Sem nome';
      const id = Date.now() + '-' + Math.random().toString(36).slice(2, 7);
      const ok = salvarNoRanking([{ id: id, nome: nome, pontos: J.pontos, pct: pct, modo: rotuloModo(), data: new Date().toISOString() }]);
      msg.textContent = ok ? 'Pontuação salva!' : 'Não foi possível salvar neste navegador (o armazenamento está bloqueado).';
      $('#lista-ranking').innerHTML = rankingHTML(id);
      if (ok) e.currentTarget.querySelectorAll('input,button').forEach(function (x) { x.disabled = true; });
    });
    on('#salvar-equipes', 'click', function (e) {
      const base = Date.now();
      const entradas = J.equipes.map(function (eq, i) {
        const rs = regs.filter(function (r) { return r.equipe === eq.nome; });
        const p = rs.length ? Math.round(rs.filter(function (r) { return r.certa; }).length / rs.length * 100) : 0;
        return { id: base + '-' + i, nome: eq.nome, pontos: eq.pontos, pct: p, modo: 'Equipes', data: new Date().toISOString() };
      });
      const ok = salvarNoRanking(entradas);
      msg.textContent = ok ? 'Placar salvo!' : 'Não foi possível salvar neste navegador (o armazenamento está bloqueado).';
      $('#lista-ranking').innerHTML = rankingHTML(entradas[0].id);
      if (ok) e.currentTarget.disabled = true;
    });
    on('#limpar-ranking', 'click', function () {
      if (!window.confirm('Apagar todas as pontuações salvas neste aparelho?')) return;
      guardar.gravar(CHAVE_RANKING, []);
      $('#lista-ranking').innerHTML = rankingHTML();
    });
    // Jogar de novo: mesma partida (no modo equipes, com as mesmas equipes), direto na introdução
    const jogarNovo = function () { somClique(); const r = J.refazer; novoJogo(r.modo, r.nomes); };
    on('#jogar-novo', 'click', jogarNovo);
    on('#jogar-novo-2', 'click', jogarNovo);
    on('#inicio', 'click', renderInicio);
  }

  /* ================= Teclado ================= */
  document.addEventListener('keydown', function (e) {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.target.closest && e.target.closest('input, textarea, select')) return;
    if (!J || !J.r || tela.dataset.tela !== 'pergunta') return;
    const q = atual();
    const k = e.key.toLowerCase();
    if (J.r.respondida) {
      if (k === 'enter' && document.activeElement && document.activeElement.tagName === 'BUTTON') return; // o próprio botão já responde ao Enter
      if (k === 'enter' || e.key === 'ArrowRight') { const b = $('#proxima'); if (b) { e.preventDefault(); b.click(); } }
      return;
    }
    if (q.tipo === 'multipla') {
      const mapa = { '1': 'A', '2': 'B', '3': 'C', '4': 'D', a: 'A', b: 'B', c: 'C', d: 'D' };
      if (mapa[k]) { e.preventDefault(); responder(mapa[k]); }
    } else if (q.tipo === 'verdadeiro_falso') {
      const v = (k === '1' || k === 'v' || k === 'a') ? 'Verdadeiro' : (k === '2' || k === 'f' || k === 'b') ? 'Falso' : null;
      if (v) { e.preventDefault(); responder(v); }
    }
  });

  renderInicio();
})();
</script>
</body>
</html>
